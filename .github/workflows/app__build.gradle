plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Signing. The same keystore (GitHub Secrets) is meant to be used by OG STREAM STUDIO and
// OG CLIP STUDIO so that the signature-level IPC permission works (see docs/ARCHITECTURE.md).
// Nothing secret is stored in this file: values come from environment variables only.
def ksFile = System.getenv('OGCLIP_KEYSTORE_FILE')
def haveKeystore = ksFile != null && !ksFile.isEmpty() && new File(ksFile).exists()

android {
    namespace 'com.ogclip.studio'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ogclip.studio'
        minSdk 29            // playback audio capture + MediaStore scoped storage
        targetSdk 34
        versionCode 1
        versionName '0.1.0-phase1'
    }

    if (haveKeystore) {
        signingConfigs {
            shared {
                storeFile file(ksFile)
                storePassword System.getenv('OGCLIP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('OGCLIP_KEY_ALIAS')
                keyPassword System.getenv('OGCLIP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (haveKeystore) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            if (haveKeystore) signingConfig signingConfigs.shared
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Phase 1-2 use framework APIs only. The editor (Phase 3) needs a real transcoder: Google's Media3 Transformer.
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation 'androidx.media3:media3-effect:1.3.1'
    implementation 'androidx.media3:media3-transformer:1.3.1'
    testImplementation 'junit:junit:4.13.2'
}
