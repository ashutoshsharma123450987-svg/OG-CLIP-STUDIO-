name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix folder layout (moves files into folders)
        run: |
          shopt -s nullglob
          for f in *__*; do
            dest="${f//__//}"
            mkdir -p "$(dirname "$dest")"
            git mv -f "$f" "$dest"
          done
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Fix folder layout" && git push)
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK (zip artifact)
        uses: actions/upload-artifact@v4
        with:
          name: OG-CLIP-STUDIO-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk OG-CLIP-STUDIO-debug.apk
          gh release delete latest-debug --yes --cleanup-tag || true
          gh release create latest-debug OG-CLIP-STUDIO-debug.apk --title "OG CLIP STUDIO debug" --notes "Debug build" --prerelease
